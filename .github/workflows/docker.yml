name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]          # trigger on version tags e.g. v1.0.0
  pull_request:
    branches: [main]      # build-only on PRs, no push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lb2lidarr
          tags: |
            type=semver,pattern={{version}}        # v1.2.3 → 1.2.3
            type=semver,pattern={{major}}.{{minor}} # v1.2.3 → 1.2
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha    # GitHub Actions cache speeds up rebuilds
          cache-to: type=gha,mode=max
