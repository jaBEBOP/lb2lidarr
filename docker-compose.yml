services:
  lb2lidarr:
    build: .
    container_name: lb2lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 */6 * * *}
      - LB_USERS=${LB_USERS}
      - LB_TOKENS=${LB_TOKENS}
      - LIDARR_URL=${LIDARR_URL}
      - LIDARR_API_KEY=${LIDARR_API_KEY}
      - LIDARR_ROOT_FOLDER=${LIDARR_ROOT_FOLDER}
      - LIDARR_QUALITY_PROFILE_ID=${LIDARR_QUALITY_PROFILE_ID:-1}
      - LIDARR_METADATA_PROFILE_ID=${LIDARR_METADATA_PROFILE_ID:-1}
      - MUSICBRAINZ_URL=${MUSICBRAINZ_URL:-https://musicbrainz.org}
      - USE_LOCAL_MUSICBRAINZ=${USE_LOCAL_MUSICBRAINZ:-false}
      - LOCAL_MUSICBRAINZ_URL=${LOCAL_MUSICBRAINZ_URL:-}
      - ENABLE_RATE_LIMITING=${ENABLE_RATE_LIMITING:-true}
      - RATE_LIMIT_DELAY=${RATE_LIMIT_DELAY:-0.5}
      - MAX_PARALLEL_REQUESTS=${MAX_PARALLEL_REQUESTS:-10}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
      - ARTIST_INDEX_POLL_INTERVAL=${ARTIST_INDEX_POLL_INTERVAL:-5}
      - ARTIST_INDEX_TIMEOUT=${ARTIST_INDEX_TIMEOUT:-300}
    volumes: []
